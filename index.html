<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>富士雪國</title>
<meta name="theme-color" content="#FFFCF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="富士雪國">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#FFFCF6;color:#3E3A39;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#FFFCF6;padding-top:env(safe-area-inset-top,0px)}
  #splash{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#FFFCF6;z-index:1;transition:opacity .3s}
  #splash img{width:112px;height:112px;border:3px solid #3E3A39;border-radius:26px}
  #splash p{margin:14px 0 0;font-size:16px}
  #splash small{display:block;margin-top:6px;color:#6A6463}
  #splash.off{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){#splash{transition:none}}
</style>
</head>
<body>
<div id="splash"><div><img src="icon-192.png" alt=""><p>富士湖光 × 越後雪國</p><small id="hint">載入中…</small></div></div>
<iframe id="app" title="富士湖光 × 越後雪國" allow="clipboard-write"></iframe>
<script>
  // 把 Apps Script 部署後的網址(結尾是 /exec)貼在這裡
  var EXEC_URL = "https://script.google.com/macros/s/AKfycbxOemysDY5MTfimYLz3Q5ZtZ3DHo2AucKnC5cLF4mDwnd9BUCOzC2aqr6wLfYZzDL-lDg/exec";
  var f = document.getElementById("app"), s = document.getElementById("splash"), h = document.getElementById("hint");
  if (!EXEC_URL) { h.textContent = "還沒設定網址:請在 index.html 填入 EXEC_URL"; }
  else {
    f.addEventListener("load", function(){ s.classList.add("off"); });
    f.src = EXEC_URL;
    setTimeout(function(){ if (!s.classList.contains("off")) h.textContent = "還在載入,網路慢的時候要等幾秒…"; }, 6000);
  }
  if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
</html>
